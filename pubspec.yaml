name: estimation
description: "سهرة ورق — لعبة ورق تنافسية للشبكة المحلية"
publish_to: 'none'
version: 1.12.1+24
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^8.2.1
  uuid: ^4.4.0
  playing_cards_ui: ^0.5.3+13
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.5.0
  google_sign_in: ^7.2.0
  delightful_toast: ^1.1.0
  heroine: ^0.7.2
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  device_info_plus: ^13.2.0
  shelf: ^1.4.1
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1
  network_info_plus: ^8.2.1
  nsd: ^5.0.0
  share_plus: ^13.3.0
  hugeicons: ^1.1.7
  shimmer: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.png
    - assets/back.png
    - assets/poker.png
    - assets/99.png
    - assets/estimation.png
    - assets/basra.png
    - assets/ranks/
    - assets/audio/
    - assets/theme_1/
    - assets/theme_2/
    - assets/theme_3/
    - assets/theme_4/
    - assets/wallpapers/w1.jpg
    - assets/wallpapers/w2.jpg
    - assets/wallpapers/login-wall.png
    - assets/avatars/
    - assets/p1.png
    - assets/google.png
    - assets/logo.png
    - assets/login.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A0B3D"
  adaptive_icon_foreground: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#1A0B3D"
    theme_color: "#1A0B3D"
