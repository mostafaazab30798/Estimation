name: estimation
description: "كوتشينة — لعبة ورق تنافسية للشبكة المحلية"
publish_to: 'none'
version: 1.6.0+17
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^8.2.1
  uuid: ^4.4.0
  playing_cards_ui: ^0.5.3+13
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.5.0
  google_sign_in: ^7.2.0
  delightful_toast: ^1.1.0
  heroine: ^0.7.2
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  dio: ^5.8.0
  open_filex: ^4.4.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  device_info_plus: ^13.2.0
  shelf: ^1.4.1
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1
  network_info_plus: ^8.2.1
  nsd: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.png
    - assets/back.png
    - assets/poker.png
    - assets/audio/
    - assets/theme_1/
    - assets/theme_2/
    - assets/wallpapers/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/cards.png"
  min_sdk_android: 21
  adaptive_icon_background: "#161D4A"
  adaptive_icon_foreground: "assets/cards.png"
