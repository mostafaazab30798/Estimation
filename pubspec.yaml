name: estimation
description: "كوتشينة — لعبة ورق تنافسية للشبكة المحلية"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  playing_cards_ui: ^0.5.3+13
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.5.0
  toastification: ^3.2.0
  heroine: ^0.7.2
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.png
    - assets/back-maroon.png
    - assets/poker.png
    - assets/audio/
    - assets/theme_1/
    - assets/theme_2/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/cards.png"
  min_sdk_android: 21
  adaptive_icon_background: "#161D4A"
  adaptive_icon_foreground: "assets/cards.png"
