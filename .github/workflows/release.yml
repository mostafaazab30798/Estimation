name: Flutter Release

on:
  push:
    branches:
      - main

# Web job (Git-connected Pages + Wrangler upload from this workflow):
#   1. Pause Cloudflare automatic builds (Flutter is not on CF's build image).
#   2. GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   3. Optional repo variable CLOUDFLARE_PAGES_PROJECT if the Pages
#      project is not named "estimation".

permissions:
  contents: write
  deployments: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true


      # ============================================================
      # 3. Get Flutter dependencies
      # ============================================================
      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # 4. Read version from pubspec.yaml
      #
      # Example:
      # version: 1.4.2+15
      #
      # version_name = 1.4.2
      # version_code = 15
      # ============================================================
      - name: Get app version
        id: version
        shell: bash
        run: |

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')

          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)

          echo "======================================"
          echo "Flutter Version Information"
          echo "======================================"

          echo "Full Version : $VERSION"
          echo "Version Name : $VERSION_NAME"
          echo "Version Code : $VERSION_CODE"

          echo "======================================"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. Read Release Notes
      #
      # Release notes should be stored in:
      #
      # release_notes.md
      #
      # If the file doesn't exist, a default message will be used.
      # ============================================================
      - name: Get release notes
        id: notes
        shell: bash
        run: |

          if [ -f release_notes.md ]; then

            echo "Release notes file found."

            {
              echo 'notes<<EOF'
              cat release_notes.md
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"

          else

            echo "Release notes file not found."
            echo "Using default release notes."

            {
              echo 'notes<<EOF'
              echo '🎉 تحديث جديد للتطبيق'
              echo ''
              echo 'تحسينات عامة وإصلاحات.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"

          fi


      # ============================================================
      # 6. Configure Keystore for Release Signing
      # ============================================================
      - name: Setup Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 secret is required for release builds."
            echo "Release builds must not fall back to the debug signing key. See android/SIGNING.md."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "❌ KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets are required."
            exit 1
          fi

          echo "Decoding release keystore..."
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          echo "Creating key.properties..."
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

          echo "✅ Keystore and key.properties configured."

      # ============================================================
      # 7. Build Split-per-ABI Release APKs
      # ============================================================
      - name: Build Split-per-ABI Release APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BUILD_FLAGS="--release --flavor prod --split-per-abi --android-skip-build-dependency-validation"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            flutter build apk $BUILD_FLAGS \
              --dart-define=APP_ENV=production \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --dart-define=PROD_PROJECT_REF=eqmkbfxerxqihforsgvx \
              --dart-define=SERVER_AUTHORITY=true
          elif [ -f config/env.prod.json ]; then
            flutter build apk $BUILD_FLAGS \
              --dart-define-from-file=config/env.prod.json
          else
            flutter build apk $BUILD_FLAGS
          fi

      # ============================================================
      # 8. Verify APKs
      # ============================================================
      - name: Verify APKs
        shell: bash
        run: |
          APK_DIR="build/app/outputs/flutter-apk"

          # If flavored APKs were generated, create non-flavor aliases for standard release download URLs
          if [ -f "$APK_DIR/app-arm64-v8a-prod-release.apk" ]; then
            echo "Creating standard aliases for prod APKs..."
            cp -f "$APK_DIR/app-arm64-v8a-prod-release.apk" "$APK_DIR/app-arm64-v8a-release.apk"
            cp -f "$APK_DIR/app-armeabi-v7a-prod-release.apk" "$APK_DIR/app-armeabi-v7a-release.apk"
            cp -f "$APK_DIR/app-x86_64-prod-release.apk" "$APK_DIR/app-x86_64-release.apk"
          fi

          ARM64_APK="$APK_DIR/app-arm64-v8a-release.apk"

          echo "Checking APKs..."

          if [ ! -f "$ARM64_APK" ]; then
            echo "❌ arm64-v8a APK not found!"
            exit 1
          fi

          echo "✅ APKs found successfully:"
          ls -lh "$APK_DIR"/*.apk

      # ============================================================
      # 9. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk
            build/app/outputs/flutter-apk/app-x86_64-prod-release.apk

      # ============================================================
      # 10. Update Supabase
      # ============================================================
      - name: Update Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version_name }}/app-arm64-v8a-release.apk

        run: |

          echo "======================================"
          echo "Updating Supabase"
          echo "======================================"

          echo "Version       : $VERSION_NAME"
          echo "Version Code  : $VERSION_CODE"
          echo "Download URL  : $DOWNLOAD_URL"

          echo "======================================"


          # --------------------------------------------------------
          # Create JSON payload
          # --------------------------------------------------------

          PAYLOAD=$(jq -n \
            --arg version "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg notes "$RELEASE_NOTES" \
            --arg url "$DOWNLOAD_URL" \
            '{
              latest_version: $version,
              version_code: $version_code,
              release_notes: $notes,
              download_url: $url,
              updated_at: (now | todateiso8601)
            }'
          )


          echo "Supabase payload:"
          echo "$PAYLOAD"

          echo "======================================"


          # --------------------------------------------------------
          # Update Supabase
          # --------------------------------------------------------

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_version?id=eq.1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD"
          )


          echo "Supabase response:"
          echo "$RESPONSE"

          echo "======================================"
          echo "✅ Supabase updated successfully!"
          echo "======================================"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks


  # ============================================================
  # Web: Flutter web build → Cloudflare Pages (Direct Upload)
  # Runs in parallel with the Android job.
  # ============================================================
  build-and-deploy-web:
    name: Build Web and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'estimation' }}

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Require Cloudflare secrets
      # ============================================================
      - name: Check Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add both secrets under Settings → Secrets and variables → Actions."
            echo "Token permission: Account → Cloudflare Pages → Edit"
            exit 1
          fi
          echo "✅ Cloudflare secrets present."
          echo "Pages project: $CLOUDFLARE_PAGES_PROJECT"


      # ============================================================
      # 3. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true


      # ============================================================
      # 4. Get Flutter dependencies
      # ============================================================
      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # 5. Build Flutter Web (release, no source maps)
      # ============================================================
      - name: Build Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            flutter build web --release --no-source-maps \
              --dart-define=APP_ENV=production \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --dart-define=PROD_PROJECT_REF=eqmkbfxerxqihforsgvx \
              --dart-define=SERVER_AUTHORITY=true
          elif [ -f config/env.prod.json ]; then
            flutter build web --release --no-source-maps \
              --dart-define-from-file=config/env.prod.json
          else
            flutter build web --release --no-source-maps
          fi


      # ============================================================
      # 6. Cloudflare Pages SPA headers / redirects
      #    (copied after build in case Flutter skips underscore files)
      # ============================================================
      - name: Copy Cloudflare Pages config
        shell: bash
        run: |
          cp -f web/_headers build/web/_headers
          cp -f web/_redirects build/web/_redirects
          echo "✅ Cloudflare Pages _headers and _redirects in build/web"


      # ============================================================
      # 7. Deploy to Cloudflare Pages
      # ============================================================
      - name: Deploy to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy build/web --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true


      # ============================================================
      # 8. Print live URL
      # ============================================================
      - name: Print deployment URL
        shell: bash
        run: |
          echo "======================================"
          echo "Cloudflare Pages deployment"
          echo "======================================"
          echo "URL   : ${{ steps.cf.outputs.deployment-url }}"
          echo "Alias : ${{ steps.cf.outputs.pages-deployment-alias-url }}"
          echo "======================================"
