name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned — `version: latest` hits GitHub API rate limits on setup-cli@v1.
  SUPABASE_CLI_VERSION: "2.72.7"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  client-secrets:
    name: Client secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify client secret guard
        run: bash scripts/verify-client-secrets.sh

      - name: Verify env isolation
        run: bash scripts/verify-env-isolation.sh

  rls-security:
    name: RLS security matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start Supabase (Postgres only)
        run: supabase start -x edge-runtime,imgproxy,mailpit,storage-api,vector,realtime

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Run RLS pgTAP suite
        run: supabase test db

  license-audit:
    name: License audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Run license audit
        run: dart run tool/audit_licenses.dart